<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drum Machine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button id="secret-trigger" class="secret-trigger" type="button" aria-label="Secret unlock"></button>
    <div class="app-shell">
      <div id="secret-banner" class="secret-banner" aria-live="polite">SECRET MODE UNLOCKED</div>

      <header class="topbar">
        <div class="title-group">
          <div>
            <p class="eyebrow">Beat Builder</p>
            <h1>Drum Machine</h1>
          </div>
          <button id="play-button" class="play-button" type="button">Play</button>
        </div>

        <div class="controls">
          <div class="control-actions">
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme">☾</button>
          </div>

          <div class="slider-stack">
            <label class="tempo-control" for="tempo">
              <span>BPM</span>
              <input id="tempo" type="range" min="60" max="180" value="110" />
              <output id="tempo-value" for="tempo">110</output>
            </label>

            <div class="length-group">
              <label class="length-control" for="track-length">
                <span>Steps</span>
                <input id="track-length" type="range" min="8" max="64" step="4" value="16" />
                <output id="track-length-value" for="track-length">16</output>
              </label>

              <div class="length-preset-row" aria-label="Pattern length presets">
                <button class="length-preset" type="button" data-length="8">8</button>
                <button class="length-preset active" type="button" data-length="16">16</button>
                <button class="length-preset" type="button" data-length="32">32</button>
                <button class="length-preset" type="button" data-length="64">64</button>
              </div>
            </div>

            <label class="swing-control" for="swing">
              <span>Swing</span>
              <input id="swing" type="range" min="0" max="100" value="0" />
              <output id="swing-value" for="swing">0%</output>
            </label>

            <label class="shuffle-control" for="shuffle">
              <span>Shuffle</span>
              <input id="shuffle" type="range" min="0" max="100" value="0" />
              <output id="shuffle-value" for="shuffle">0%</output>
            </label>

            <label class="humanize-control" for="humanize">
              <span>Humanize</span>
              <input id="humanize" type="range" min="0" max="100" value="0" />
              <output id="humanize-value" for="humanize">0%</output>
            </label>

            <label class="offset-control" for="groove-offset">
              <span>Offset</span>
              <input id="groove-offset" type="range" min="0" max="25" value="0" />
              <output id="offset-value" for="groove-offset">0ms</output>
            </label>

            <label class="loop-toggle" for="loop-toggle">
              <span>Loop</span>
              <span class="switch-wrap">
                <input id="loop-toggle" type="checkbox" checked />
                <span class="switch-slider"></span>
              </span>
            </label>
          </div>
        </div>
      </header>

      <section class="song-library" aria-label="Song library">
        <div class="song-controls-row">
          <label class="song-select-group" for="song-select">
            <span>Library</span>
            <select id="song-select">
              <option value="">Choose a song</option>
            </select>
          </label>

          <button id="favorite-preset-button" class="favorite-button" type="button" aria-label="Favorite preset" title="Favorite preset">☆</button>
          <input id="song-name" type="text" class="song-name-input" maxlength="32" placeholder="Song name" />
        </div>

        <div class="song-actions">
          <button id="save-song-button" type="button">Save song</button>
          <button id="copy-link-button" type="button">Copy link</button>
          <button id="delete-song-button" type="button" class="danger-button" hidden>Delete</button>
        </div>
      </section>

      <section class="sequencer-panel" aria-label="Sequence editor">
        <div id="sequence-grid" class="sequence-grid"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
